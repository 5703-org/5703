[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["artifacts", "evidence", "backend/tests", "backend/alembic/versions"]

[tool.ruff.lint]
# The formatter owns whitespace. This gate covers executable correctness rules,
# including undefined/local names, invalid control flow and duplicate definitions.
# Unused-import/style cleanup is deliberately separate from source compatibility.
select = ["E9", "F63", "F7", "F82", "F811", "F901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
mypy_path = ["$MYPY_CONFIG_FILE_DIR", "$MYPY_CONFIG_FILE_DIR/backend"]
files = ["contracts/models.py", "contracts/http.py", "evaluation/bridge.py", "generation/types.py", "tests/typing/contract_boundaries.py"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = false

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[[tool.mypy.overrides]]
module = ["evaluation.bridge", "tests.typing.contract_boundaries"]
disallow_untyped_defs = true
