name: Local software gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: local-dev-database-only
          POSTGRES_DB: cs30_ci_browser
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U learning -d cs30_ci_browser"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      PYTHONIOENCODING: utf-8
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      APP_ENV: test
      MODEL_MODE: mock
      LLM_PROVIDER: mock
      LLM_MODEL: authored-extractive-v1
      DATABASE_URL: postgresql+psycopg://learning:local-dev-database-only@127.0.0.1:55432/cs30_ci_browser
      TEST_DATABASE_SERVER: postgresql+psycopg://learning:local-dev-database-only@127.0.0.1:55432
      STORAGE_ROOT: ${{ github.workspace }}/artifacts/ci-storage
      SECRET_KEY: ci-disposable-secret-at-least-thirty-two-characters
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.2'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned local dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          npm ci --prefix frontend
      - name: Format, lint, types, schemas, unit and PostgreSQL integration, frontend build
        run: python -m scripts.verify.all --mode mock
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare authored browser fixture in dedicated database
        run: python -m scripts.verify.ci_seed
      - name: Real API and worker browser smoke
        run: |
          mkdir -p evidence/ci artifacts/reports/frontend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > evidence/ci/api.log 2>&1 &
          python -m app.worker > evidence/ci/worker.log 2>&1 &
          npm run dev --prefix frontend -- --host 127.0.0.1 > evidence/ci/frontend.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/ready
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5173/login
          cd frontend
          npx playwright test tests/e2e/login.spec.ts tests/e2e/chat.spec.ts --grep 'login stays usable|real no-SciQ multi-turn'
      - name: Preserve actual gate and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: software-gate-evidence
          retention-days: 14
          path: |
            evidence/final/
            evidence/devtools/
            evidence/ci/
            evidence/contracts/
            artifacts/reports/frontend/
          if-no-files-found: warn
