components:
  schemas:
    AccountCreate:
      properties:
        email:
          type: string
          format: email
          title: Email
        full_name:
          type: string
          maxLength: 120
          minLength: 1
          title: Full Name
        password:
          type: string
          maxLength: 128
          minLength: 10
          title: Password
        role:
          type: string
          enum:
          - student
          - admin
          title: Role
          default: student
      additionalProperties: false
      type: object
      required:
      - email
      - full_name
      - password
      title: AccountCreate
    AccountUpdate:
      properties:
        version:
          type: integer
          title: Version
        status:
          anyOf:
          - type: string
            enum:
            - active
            - deactivated
          - type: 'null'
          title: Status
        password:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 10
          - type: 'null'
          title: Password
      additionalProperties: false
      type: object
      required:
      - version
      title: AccountUpdate
    ActivationInput:
      properties:
        test_id:
          type: string
          title: Test Id
        expected_active_version:
          type: integer
          minimum: 0.0
          title: Expected Active Version
        checker_configuration_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Checker Configuration Id
        checker_test_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Checker Test Id
      additionalProperties: false
      type: object
      required:
      - test_id
      - expected_active_version
