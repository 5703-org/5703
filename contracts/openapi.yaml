        id:
          type: string
          maxLength: 40
          minLength: 1
          title: Id
        prompt:
          type: string
          maxLength: 2000
          minLength: 1
          title: Prompt
        acceptable_answers:
          items:
            type: string
          type: array
          maxItems: 20
          title: Acceptable Answers
        required_points:
          items:
            $ref: '#/components/schemas/KnowledgePoint'
          type: array
          maxItems: 20
          title: Required Points
        numeric:
          anyOf:
          - $ref: '#/components/schemas/NumericKey'
          - type: 'null'
        hints:
          items:
            type: string
          type: array
          maxItems: 3
          title: Hints
      additionalProperties: false
      type: object
      required:
      - id
      - prompt
      title: StepKey
    SummaryOut:
      properties:
        summary_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary Id
        summary_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary Hash
        covered_until_sequence:
          anyOf:
          - type: integer
          - type: 'null'
          title: Covered Until Sequence
        summary_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary Text
      additionalProperties: false
      type: object
      required:
      - summary_id
      - summary_hash
      - covered_until_sequence
      - summary_text
      title: SummaryOut
    TaskOut:
      properties:
        id:
          type: string
          title: Id
        session_id:
          type: string
          title: Session Id
        question:
          type: string
          title: Question
        task_type:
          type: string
          title: Task Type
        teaching_mode:
          type: string
          enum:
          - direct
          - hint
          title: Teaching Mode
        practice_item_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Practice Item Id
        practice_goal_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Practice Goal Id
        practice_progress_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Practice Progress Version
        help_level:
          type: integer
          title: Help Level
        state:
          type: string
          title: State
        version:
          type: integer
          title: Version
        pending_tutor_question_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Pending Tutor Question Id
        pending_tutor_question:
          anyOf:
          - type: string
          - type: 'null'
          title: Pending Tutor Question
        pending_tutor_question_version:
          type: integer
          title: Pending Tutor Question Version
          default: 0
        expected_response_kind:
          anyOf:
          - type: string
            enum:
            - concept
            - numeric
            - explanation
            - choice
          - type: 'null'
          title: Expected Response Kind
        current_step:
          type: integer
          title: Current Step
          default: 1
        turn_role:
          type: string
          enum:
          - user_question
          - learner_attempt
          title: Turn Role
          default: user_question
        last_attempt_evaluation:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Last Attempt Evaluation
      additionalProperties: false
      type: object
      required:
      - id
      - session_id
      - question
      - task_type
      - teaching_mode
      - help_level
      - state
      - version
      title: TaskOut
    TeachingInput:
      properties:
        base_answer_ids:
          items:
            type: string
          type: array
          maxItems: 1000
          minItems: 1
          title: Base Answer Ids
        seed:
          type: integer
          title: Seed
          default: 0
        configuration_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Configuration Id
      additionalProperties: false
      type: object
      required:
      - base_answer_ids
      title: TeachingInput
    TextSegment:
      properties:
        text:
          type: string
          title: Text
        highlight:
          type: boolean
          title: Highlight
          default: false
        fragment_ids:
          items:
            type: string
          type: array
          title: Fragment Ids
      additionalProperties: false
      type: object
      required:
      - text
      title: TextSegment
    TokenData:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in_minutes:
          type: integer
          title: Expires In Minutes
      type: object
      required:
      - access_token
      - expires_in_minutes
      title: TokenData
    UserOut:
      properties:
        id:
          type: string
          title: Id
        email:
          type: string
          title: Email
        full_name:
          type: string
          title: Full Name
        role:
          type: string
          title: Role
        status:
          type: string
          title: Status
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - email
      - full_name
      - role
      - status
      - version
      title: UserOut
    UserUpdate:
      properties:
        full_name:
          type: string
          maxLength: 120
          minLength: 1
          title: Full Name
      type: object
      required:
      - full_name
      title: UserUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VersionInput:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
      additionalProperties: false
      type: object
      required:
      - expected_version
      title: VersionInput
    VisualReviewInput:
      properties:
        decision:
          type: string
          enum:
          - accepted
          - rejected
          - needs_more
          title: Decision
        source_page_match:
          type: boolean
          title: Source Page Match
        geometry_correct:
          type: boolean
          title: Geometry Correct
        native_text_correct:
          type: boolean
          title: Native Text Correct
        evidence:
          type: string
          maxLength: 2000
          minLength: 12
          title: Evidence
        previous_review_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Review Id
      type: object
      required:
      - decision
      - source_page_match
      - geometry_correct
      - native_text_correct
      - evidence
      title: VisualReviewInput
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - error
      - meta
      title: ErrorEnvelope
      type: object
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
